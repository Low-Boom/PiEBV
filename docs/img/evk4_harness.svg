<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="20" y="26" font-size="17" font-weight="bold">EVK4 camera harness (one per camera): PiEBV J1-J6 to Prophesee EVK4 sync / trigger connector</text>
  <!-- board connector -->
  <rect x="30" y="60" width="150" height="330" fill="#f2f2f2" stroke="#333"/>
  <text x="105" y="52" text-anchor="middle" font-weight="bold">P1: board end</text>
  <text x="105" y="408" text-anchor="middle">2 x 5 receptacle, 2.54 mm</text>
  <text x="105" y="424" text-anchor="middle">(mates with J1-J6)</text>
  <g text-anchor="end">
    <text x="172" y="95">1  n.c.</text>
    <text x="172" y="125" font-weight="bold">2  GND</text>
    <text x="172" y="155">3  TDRSTN  n.c.</text>
    <text x="172" y="185" font-weight="bold">4  Trigger</text>
    <text x="172" y="215" font-weight="bold">5  Sync</text>
    <text x="172" y="245">6  n.c.</text>
    <text x="172" y="275" font-weight="bold">7  GND</text>
    <text x="172" y="305">8  n.c.</text>
    <text x="172" y="335">9  n.c.</text>
    <text x="172" y="365">10  n.c.</text>
  </g>
  <!-- camera connector -->
  <rect x="800" y="60" width="160" height="330" fill="#f2f2f2" stroke="#333"/>
  <text x="880" y="52" text-anchor="middle" font-weight="bold">P2: camera end</text>
  <text x="880" y="408" text-anchor="middle">Hirose ix Industrial plug,</text>
  <text x="880" y="424" text-anchor="middle">B key, 10 positions</text>
  <g>
    <text x="808" y="95">1  SYNC_OUT_P  n.c.</text>
    <text x="808" y="125">2  SYNC_OUT_N  n.c.</text>
    <text x="808" y="155" font-weight="bold">3  SYNC_IN_P</text>
    <text x="808" y="185" font-weight="bold">4  SYNC_IN_N</text>
    <text x="808" y="215" font-weight="bold">5  TRIG_IN_P</text>
    <text x="808" y="245" font-weight="bold">6  TRIG_IN_N</text>
    <text x="808" y="275">7  n.c.</text>
    <text x="808" y="305">8  n.c.</text>
    <text x="808" y="335">9  n.c.</text>
    <text x="808" y="365">10  n.c.</text>
  </g>
  <!-- pair 1: Sync (P1.5 -> P2.3), GND (P1.7 -> P2.4) -->
  <g fill="none" stroke-width="2.5">
    <path d="M180 210 H430 C520 210 560 150 650 150 H800" stroke="#c0392b"/>
    <path d="M180 270 H430 C520 270 560 180 650 180 H800" stroke="#222"/>
    <!-- pair 2: Trigger (P1.4 -> P2.5), GND (P1.2 -> P2.6) -->
    <path d="M180 180 H230 V160 H400 C520 160 560 210 650 210 H800" stroke="#2471a3"/>
    <path d="M180 120 H400 C520 120 560 240 650 240 H800" stroke="#222"/>
  </g>
  <text x="300" y="240" text-anchor="middle" font-size="11">no parts in the harness: the 47R series</text>
  <text x="300" y="254" text-anchor="middle" font-size="11">resistors are on the board (R52-R63)</text>
  <!-- cable -->
  <rect x="440" y="100" width="200" height="190" rx="18" fill="none" stroke="#888" stroke-dasharray="6 4"/>
  <text x="540" y="92" text-anchor="middle">cable: 2 twisted pairs with shield, 2 m or less</text>
  <text x="540" y="306" text-anchor="middle" font-size="11">pair 1: Sync + GND (P1.5 / P1.7)    pair 2: Trigger + GND (P1.4 / P1.2)</text>
  <path d="M640 290 H720 V330 H800" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="712" y="350" text-anchor="end" font-size="11">shield to the P2 plug shell only</text>
  <text x="20" y="450" font-size="12">Board: J22 fitted (+VCAM = 3.3 V, D1 lit). TDRSTN (pin 3) is not used: the EVK4 has no pixel-reset input. Check the P2 pin numbers against the EVK4 manual before assembly.</text>
</svg>
