; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Platform choice
; ---------------
; PlatformIO's official "raspberrypi" platform only supports RP2040 (no Pico 2 /
; Pico 2 W board defs, and its Arduino framework resolves to the Mbed OS core,
; which has no RP2350 support at all). Max Gerhardt's community fork tracks Earle
; Philhower's arduino-pico core, which does support RP2350 / Pico 2 (W).
;
; Reproducible build: the platform is pinned to an exact fork commit
; ------------------------------------------------------------------
; That SHA fixes the packages the platform installs for this build:
;   * framework-arduinopico : the fork's platform.json pins arduino-pico commit
;     fd65f6d4ab168d4bb181a3709738fe353ac93585 (6.1.0 + 4 upload-script/doc
;     commits; package 1.60100.0; bundles pico-sdk 2.3.0).
;   * toolchain / pioasm / picotool (and openocd, if SWD upload is used): the
;     fork's platform.py swaps platform.json's "dummy" URLs for fixed
;     pico-quick-toolchain 5.0.0 release downloads (5.160100.260719, GCC 16.1.0).
; PlatformIO clones a commit-pinned git package in full and never moves it on
; "pio pkg update". Not covered by this pin: PlatformIO Core itself (built with
; 6.2.0) and its tool-scons (4.41101.0). Release downloads are not checksummed.
; Windows: keep the PlatformIO core dir on a short path (the default
; %USERPROFILE%\.platformio is fine); the core's nested git submodules exceed
; git's path limits under long directories.
;
; To upgrade: move the SHA to a newer fork commit, check that the PACKAGES lines
; in the build log change as expected, and retest timing on hardware. Do not add
; a platform_packages override for framework-arduinopico alone: it takes
; precedence over the fork's platform.py and can split the core from its
; matching toolchain.

[platformio]
default_envs = pico2w

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
; 150 MHz is already the board default for both Pico 2 boards; stated explicitly
; because the PIO timing assumes it: 6.667 ns per pulse-channel cycle, and an
; exact integer divider (75) for the default 1 MHz SYNC clock.
board_build.f_cpu = 150000000L
monitor_speed = 115200

; Flash the image that matches the fitted module. The pico2w image runs the CYW43
; driver's init at boot (it configures the radio pins and leaves the radio chip
; powered off; the firmware never uses Wi-Fi/BT); a plain Pico 2 has no such chip.

; Raspberry Pi Pico 2 W -- the module normally fitted. Its radio is not used;
; the W is fitted only because it is easier to buy.
[env:pico2w]
board = rpipico2w

; Plain Raspberry Pi Pico 2 (no radio); same pinout, fits the same socket.
; Build with: pio run -e pico2
[env:pico2]
board = rpipico2
